spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/autism_health_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
